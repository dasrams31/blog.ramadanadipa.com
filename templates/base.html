<script>
(function(){var b=document.getElementById('nav-toggle'),m=document.getElementById('nav-links');
b.addEventListener('click',function(){var o=m.classList.toggle('open');
b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Tutup menu':'Buka menu');});
m.addEventListener('click',function(e){if(e.target.tagName==='A'){m.classList.remove('open');
b.setAttribute('aria-expanded','false');}});})();
</script>
<script>
/* view counter: hit artikel ini, tampilkan angka di semua .views (tunggu DOM siap) */
document.addEventListener('DOMContentLoaded',function(){
var els=document.querySelectorAll('[data-views-for]');if(!els.length)return;
function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' jt';
if(n>=1e3)return (n/1e3).toFixed(1).replace('.',',')+' rb';return ''+n;}
var slugs=[...new Set([...els].map(function(e){return e.dataset.viewsFor}))];
var mark=document.getElementById('post-slug');
var hit=mark?fetch('/api/hit',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({slug:mark.dataset.slug})}).catch(function(){}):Promise.resolve();
hit.then(function(){
fetch('/api/views?slug='+slugs.map(encodeURIComponent).join(',')).then(function(r){return r.json();})
.then(function(d){els.forEach(function(e){var v=d[e.dataset.viewsFor];
if(v!=null)e.querySelector('b').textContent=fmt(v);});}).catch(function(){});});});
</script>
<main>
{{content}}
</main>
<footer id="footer">
  <div class="foot-mark" aria-hidden="true">侍 BLOG</div>
  <p>© {{year}} Rama Danadipa Putra Wijaya · <a href="https://ramadanadipa.com/">ramadanadipa.com</a></p>

<!-- Ramadanadipa chat widgets: Webchat (kiri, ruang chat publik TANPA AI) + Tanya Blog (kanan, guardrail ketat).
     Dua panel bisa switch: buka satu menutup yang lain.
     Webchat API: https://ramadanadipa.com/api/webchat (GET ?after=, POST {name, body})
     Tanya API: https://ramadanadipa.com/api/chat-ramadanadipa -->
<style>
.rdchat-fab{position:fixed;bottom:18px;z-index:9998;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #f4f1ea;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.rdchat-fab svg{width:24px;height:24px}
.rdchat-fab.umum{left:18px;background:#e23a2e}
.rdchat-fab.umum svg{fill:#fff}
.rdchat-fab.tanya{right:18px;background:#c9a227}
.rdchat-fab.tanya svg{fill:#17171c}
.rdchat-fab.hidden{opacity:0;visibility:hidden;pointer-events:none}
.rdchat-panel{position:fixed;bottom:18px;z-index:9999;width:min(360px,calc(100vw - 28px));height:min(560px,calc(100vh - 36px));background:#17171c;color:#f4f1ea;border:2px solid rgba(244,241,234,.16);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s ease,transform .25s ease,visibility 0s linear .25s}
.rdchat-panel.open{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .25s ease,transform .25s ease}
.rdchat-panel.umum{left:18px}
.rdchat-panel.tanya{right:18px}
.rdchat-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid rgba(244,241,234,.12)}
.rdchat-head .tile{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center}
.rdchat-head .tile svg{width:20px;height:20px}
.rdchat-panel.umum .tile{background:#e23a2e}
.rdchat-panel.umum .tile svg{fill:#fff}
.rdchat-panel.tanya .tile{background:#c9a227}
.rdchat-panel.tanya .tile svg{fill:#17171c}
.rdchat-head h4{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.rdchat-head p{margin:2px 0 0;font-size:11.5px;font-weight:600;opacity:.6}
.rdchat-close{margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;border:1.5px solid rgba(244,241,234,.25);background:transparent;color:#f4f1ea;font-size:17px;font-weight:800;line-height:1;cursor:pointer}
.rdchat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.rdchat-msg{max-width:88%;padding:10px 12px;border-radius:13px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rdchat-msg.user{align-self:flex-end;background:#e23a2e;color:#fff;border-bottom-right-radius:4px}
.rdchat-panel.tanya .rdchat-msg.user{background:#c9a227;color:#17171c}
.rdchat-msg.bot{align-self:flex-start;background:rgba(244,241,234,.08);border-bottom-left-radius:4px}
.rdchat-msg.bot a{color:#e8b4ae}
.rdchat-panel.tanya .rdchat-msg.bot a{color:#e3c878}
.rdchat-msg.mine{align-self:flex-end;background:#e23a2e;color:#fff;border-bottom-right-radius:4px}
.rdchat-msg.other{align-self:flex-start;background:rgba(244,241,234,.08);border-bottom-left-radius:4px}
.rdchat-meta{display:flex;gap:8px;font-size:11px;opacity:.75;margin-bottom:3px}
.rdchat-meta b{font-weight:800}
.rdchat-note{align-self:center;text-align:center;font-size:12px;opacity:.55;line-height:1.5;padding:2px 8px}
.rdchat-typing{opacity:.6;font-size:13px}
.rdchat-form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(244,241,234,.12)}
.rdchat-form input{flex:1;min-width:0;background:rgba(244,241,234,.07);border:1.5px solid rgba(244,241,234,.16);border-radius:11px;color:#f4f1ea;font-size:14px;padding:11px 12px;outline:none}
.rdchat-form input:focus{border-color:#e23a2e}
.rdchat-panel.tanya .rdchat-form input:focus{border-color:#c9a227}
.rdchat-form button{flex:none;background:#e23a2e;color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:800;padding:0 16px;cursor:pointer}
.rdchat-panel.tanya .rdchat-form button{background:#c9a227;color:#17171c}
.rdchat-form button:disabled{opacity:.5;cursor:default}
.rdchat-form-web{flex-direction:column}
.rdchat-form-web .rdchat-msgrow{display:flex;gap:8px;width:100%}
@media (max-width:480px){
  .rdchat-panel{left:14px !important;right:14px !important;bottom:14px;width:auto}
  .rdchat-fab.umum{left:14px;bottom:14px}
  .rdchat-fab.tanya{right:14px;bottom:14px}
}
</style>
<button class="rdchat-fab umum" id="rdchat-fab-umum" type="button" aria-label="Buka Webchat"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg></button>
<button class="rdchat-fab tanya" id="rdchat-fab-tanya" type="button" aria-label="Buka Tanya Blog"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg></button>
<div class="rdchat-panel umum" id="rdchat-panel-umum" role="dialog" aria-label="Webchat" aria-hidden="true">
  <div class="rdchat-head"><span class="tile"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg></span><div><h4>Webchat</h4><p>Ngobrol bareng pengunjung lain</p></div><button class="rdchat-close" type="button" aria-label="Tutup">&times;</button></div>
  <div class="rdchat-body" id="rdchat-body-umum"></div>
  <form class="rdchat-form rdchat-form-web" id="rdchat-form-umum"><input type="text" id="rdchat-name-umum" placeholder="Nama kamu..." maxlength="30" autocomplete="off"><div class="rdchat-msgrow"><input type="text" id="rdchat-input-umum" placeholder="Tulis pesan..." maxlength="500" autocomplete="off"><button type="submit">Kirim</button></div></form>
</div>
<div class="rdchat-panel tanya" id="rdchat-panel-tanya" role="dialog" aria-label="Tanya Blog" aria-hidden="true">
  <div class="rdchat-head"><span class="tile"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg></span><div><h4>Tanya Blog</h4><p>Seputar artikel &amp; tentang Rama</p></div><button class="rdchat-close" type="button" aria-label="Tutup">&times;</button></div>
  <div class="rdchat-body" id="rdchat-body-tanya"></div>
  <form class="rdchat-form" id="rdchat-form-tanya"><input type="text" placeholder="Tanya soal artikel atau Rama..." maxlength="1000" autocomplete="off"><button type="submit">Kirim</button></form>
</div>
<script>
(function(){
  var widgets = {};
  function closeOther(mode){
    Object.keys(widgets).forEach(function(m){ if (m !== mode) widgets[m].close(); });
  }

  /* ===== TANYA BLOG (AI, guardrail ketat) ===== */
  (function(){
    var mode = 'tanya';
    var API_URL = 'https://ramadanadipa.com/api/chat-ramadanadipa';
    var GREET = 'Halo! Tanya apa aja seputar artikel blog dan tentang Rama. Di luar itu aku nggak bisa jawab ya.';
    var KEY = 'rd-chat-tanya';
    var panel = document.getElementById('rdchat-panel-' + mode);
    var fab = document.getElementById('rdchat-fab-' + mode);
    var body = document.getElementById('rdchat-body-' + mode);
    var form = document.getElementById('rdchat-form-' + mode);
    var input = form.querySelector('input');
    var btn = form.querySelector('button');
    var closeBtn = panel.querySelector('.rdchat-close');
    var history = [];
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) history = JSON.parse(raw).filter(function(m){ return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'; });
    } catch(e) { history = []; }
    function save(){ try { localStorage.setItem(KEY, JSON.stringify(history.slice(-30))); } catch(e){} }
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function linkify(s){
      var t = esc(s);
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return t.replace(/(?<!href=")(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function addMsg(role, text){
      var div = document.createElement('div');
      div.className = 'rdchat-msg ' + role;
      div.innerHTML = linkify(text);
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
      return div;
    }
    function render(){
      body.innerHTML = '';
      addMsg('assistant', GREET);
      history.forEach(function(m){ addMsg(m.role, m.content); });
    }
    function open(){
      closeOther(mode);
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      fab.classList.add('hidden');
      render();
      input.focus();
    }
    function close(){
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      fab.classList.remove('hidden');
    }
    fab.addEventListener('click', open);
    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var text = input.value.trim();
      if (!text || btn.disabled) return;
      input.value = '';
      history.push({role: 'user', content: text});
      addMsg('user', text);
      save();
      btn.disabled = true;
      var typing = addMsg('assistant', 'Rama lagi ngetik...');
      typing.classList.add('rdchat-typing');
      var payload = {mode: mode, messages: history.slice(-16)};
      fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
        .then(function(r){ return r.json(); })
        .then(function(data){
          typing.remove();
          var reply = (data && data.reply) || (data && data.error) || 'Chatbot lagi sibuk, coba lagi sebentar lagi ya.';
          history.push({role: 'assistant', content: reply});
          addMsg('assistant', reply);
          save();
        })
        .catch(function(){
          typing.remove();
          addMsg('assistant', 'Chatbot lagi sibuk, coba lagi sebentar lagi ya.');
        })
        .finally(function(){ btn.disabled = false; input.focus(); });
    });
    widgets[mode] = {open: open, close: close};
    render();
  })();

  /* ===== WEBCHAT (ruang chat publik, TANPA AI) ===== */
  (function(){
    var mode = 'umum';
    var API_URL = 'https://ramadanadipa.com/api/webchat';
    var NAME_KEY = 'rd-webchat-name';
    var panel = document.getElementById('rdchat-panel-' + mode);
    var fab = document.getElementById('rdchat-fab-' + mode);
    var body = document.getElementById('rdchat-body-' + mode);
    var form = document.getElementById('rdchat-form-' + mode);
    var nameInput = document.getElementById('rdchat-name-umum');
    var input = document.getElementById('rdchat-input-umum');
    var btn = form.querySelector('button');
    var closeBtn = panel.querySelector('.rdchat-close');
    var seen = {};
    var lastId = 0;
    var pollTimer = null;
    try { nameInput.value = localStorage.getItem(NAME_KEY) || ''; } catch(e){}
    function fmtTime(iso){
      try { return new Date(iso).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta'}); }
      catch(e){ return ''; }
    }
    function myName(){ return nameInput.value.trim(); }
    function addChat(m){
      var mine = m.name === myName() && myName() !== '';
      var div = document.createElement('div');
      div.className = 'rdchat-msg ' + (mine ? 'mine' : 'other');
      var meta = document.createElement('div');
      meta.className = 'rdchat-meta';
      var nm = document.createElement('b');
      nm.textContent = m.name;
      var tm = document.createElement('span');
      tm.textContent = fmtTime(m.created_at);
      meta.appendChild(nm);
      meta.appendChild(tm);
      var tx = document.createElement('div');
      tx.textContent = m.body;
      div.appendChild(meta);
      div.appendChild(tx);
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }
    function load(){
      fetch(API_URL + '?after=' + lastId)
        .then(function(r){ return r.json(); })
        .then(function(data){
          (data.messages || []).forEach(function(m){
            if (seen[m.id]) return;
            seen[m.id] = true;
            if (m.id > lastId) lastId = m.id;
            addChat(m);
          });
        })
        .catch(function(){});
    }
    function reset(){
      body.innerHTML = '';
      var note = document.createElement('div');
      note.className = 'rdchat-note';
      note.textContent = 'Ruang chat publik. Tulis namamu, kirim pesan, semua pengunjung bisa melihatnya.';
      body.appendChild(note);
      seen = {};
      lastId = 0;
    }
    function open(){
      closeOther(mode);
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      fab.classList.add('hidden');
      reset();
      load();
      if (!pollTimer) pollTimer = setInterval(load, 5000);
      (myName() ? input : nameInput).focus();
    }
    function close(){
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      fab.classList.remove('hidden');
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    fab.addEventListener('click', open);
    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
    nameInput.addEventListener('change', function(){
      try { localStorage.setItem(NAME_KEY, nameInput.value.trim()); } catch(e){}
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var name = myName();
      var text = input.value.trim();
      if (!name) { nameInput.focus(); return; }
      if (!text || btn.disabled) return;
      input.value = '';
      btn.disabled = true;
      try { localStorage.setItem(NAME_KEY, name); } catch(e){}
      fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: name, body: text})})
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (data && data.message && !seen[data.message.id]) {
            seen[data.message.id] = true;
            if (data.message.id > lastId) lastId = data.message.id;
            addChat(data.message);
          } else if (data && data.error) {
            addChat({name: 'Sistem', body: data.error, created_at: new Date().toISOString()});
          }
        })
        .catch(function(){})
        .finally(function(){ btn.disabled = false; input.focus(); });
    });
    widgets[mode] = {open: open, close: close};
  })();
})();
</script>

</body>
</html>
