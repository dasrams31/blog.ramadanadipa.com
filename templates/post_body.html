<div class="wrap post-wrap">
  <nav class="crumbs"><a href="/">Blog</a> <span>/</span> <span>{{date}}</span></nav>
  <article class="post">
    <header class="post-head">
      <div class="chips">{{tags}}</div>
      <h1>{{title}}</h1>
      <p class="post-meta">Oleh <strong>Rama Danadipa</strong> · {{date}} · {{minutes}} menit baca</p>
    </header>
    {{toc}}
    <div class="prose">
{{article}}
    </div>
{{faq}}
    <div class="author-box">
      <span class="author-kanji">侍</span>
      <div>
        <p class="author-name">Rama Danadipa Putra Wijaya</p>
        <p class="author-bio">Full Stack Developer & Co-Founder SertiKu. Menulis tutorial Laravel, React, PostgreSQL, AI, dan VPS setiap hari.</p>
      </div>
    </div>
  </article>
{{related}}
</div>
